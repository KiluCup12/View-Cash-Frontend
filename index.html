<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Cash</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background-color: #0d0d0d; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .card { background: #1a1a1a; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 350px; border: 1px solid #333; }
    input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
    button { width: 95%; padding: 12px; margin: 6px 0; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    .btn-green { background: #00e676; color: #000; }
    .btn-blue { background: #007bff; color: #fff; }
    .btn-red { background: #ff3d00; color: #fff; }
    .hidden { display: none; }
    .saldo { font-size: 28px; color: #00e676; font-weight: bold; }
  </style>
</head>
<body>

  <h1>VIEW CASH</h1>

  <!-- TELA DE AUTENTICAÇÃO -->
  <div id="auth-container" class="card">
    <h2>Aceder à Conta</h2>
    <input type="email" id="email" placeholder="O teu E-mail">
    <input type="password" id="password" placeholder="A tua Palavra-passe">
    <button class="btn-green" onclick="fazerLogin()">Entrar</button>
    <button class="btn-blue" onclick="fazerRegisto()">Criar Conta Nova</button>
    <p id="auth-msg" style="color: #ff5252; font-size: 14px;"></p>
  </div>

  <!-- PAINEL PRINCIPAL (SÓ VISÍVEL APÓS LOGIN) -->
  <div id="dashboard" class="card hidden">
    <p id="user-email" style="font-size: 12px; color: #888;"></p>
    <p>O Teu Saldo</p>
    <div class="saldo"><span id="saldo-valor">0</span> Kz</div>
    
    <hr style="border-color: #333; margin: 20px 0;">

    <h3>Tarefas Disponíveis</h3>
    <button class="btn-blue" onclick="completarTarefa(100)">Facebook - Dar Like (+100 Kz)</button>
    <button class="btn-blue" onclick="completarTarefa(150)">Facebook - Visualizar (+150 Kz)</button>
    
    <button class="btn-red" style="margin-top: 20px;" onclick="sair()">Sair da Conta</button>
  </div>

  <script>
    // CONFIGURAÇÃO DO SUPABASE
    
    const SUPABASE_URL = "https://fhvudspvpzzasrfnwjc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7DSHKpbuwOamaCsN-DtgeQ_YjZpLmpN";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let usuarioAtual = null;

    // Verificar se já existe sessão ativa
    async function checarSessao() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        carregarPainel(session.user);
      }
    }

    async function fazerRegisto() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signUp({ email, password });
      
      if (error) {
        document.getElementById('auth-msg').innerText = error.message;
      } else {
        // Criar perfil inicial na tabela
        await supabase.from('profiles').insert([{ id: data.user.id, email: email, saldo: 0 }]);
        carregarPainel(data.user);
      }
    }

    async function fazerLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        document.getElementById('auth-msg').innerText = "Dados incorretos ou erro no login.";
      } else {
        carregarPainel(data.user);
      }
    }

    async function carregarPainel(user) {
      usuarioAtual = user;
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('user-email').innerText = user.email;

      // Buscar saldo do utilizador no Supabase
      const { data } = await supabase.from('profiles').select('saldo').eq('id', user.id).single();
      if (data) document.getElementById('saldo-valor').innerText = data.saldo;
    }

    async function completarTarefa(valor) {
      if (!usuarioAtual) return;
      const valorAtual = parseFloat(document.getElementById('saldo-valor').innerText);
      const novoSaldo = valorAtual + valor;

      // Atualizar no ecrã
      document.getElementById('saldo-valor').innerText = novoSaldo;

      // Guardar saldo individual no Supabase
      await supabase.from('profiles').update({ saldo: novoSaldo }).eq('id', usuarioAtual.id);
    }

    async function sair() {
      await supabase.auth.signOut();
      location.reload();
    }

    checarSessao();
  </script>
</body>
</html>
